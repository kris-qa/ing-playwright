name: Run Tests

on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests - ${{ matrix.browser }} (${{ github.base_ref }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    container:
      image: mcr.microsoft.com/playwright/java:v1.49.0-jammy

    env:
      TEST_ENV: ${{ github.base_ref == 'master' && 'preprod' || 'dev' }}
      BROWSER: ${{ matrix.browser }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          mvn -B clean test \
            -Denv=${TEST_ENV} \
            -Dbrowser=${BROWSER}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.base_ref }}-${{ matrix.browser }}
          path: target/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.base_ref }}-${{ matrix.browser }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14