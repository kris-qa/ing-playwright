name: Run Tests

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev

      tags:
        description: 'Cucumber tags (e.g. @analytics)'
        required: false
        type: string
        default: ''

jobs:
  playwright-tests:
    name: Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    env:
      TEST_ENV: ${{ inputs.environment || 'dev' }}
      BROWSER: ${{ matrix.browser }}
      CUCUMBER_TAGS: ${{ inputs.tags || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Playwright system dependencies
        run: |
          sudo mvn -B \
            -Dexec.classpathScope=test \
            exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install-deps"

      - name: Install Playwright browser
        run: |
          mvn -B \
            -Dexec.classpathScope=test \
            exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install $BROWSER"

      - name: Run Cucumber tests
        shell: bash
        run: |
          if [[ -n "$CUCUMBER_TAGS" ]]; then
            mvn -B clean test \
              -Denv="$TEST_ENV" \
              -Dbrowser="$BROWSER" \
              -Dheadless=true \
              -Dcucumber.filter.tags="$CUCUMBER_TAGS"
          else
            mvn -B clean test \
              -Denv="$TEST_ENV" \
              -Dbrowser="$BROWSER" \
              -Dheadless=true
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results/
          if-no-files-found: warn

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: playwright-tests
    if: always()

    env:
      TEST_ENV: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true

      - name: Generate environment information
        run: |
          mkdir -p target/allure-results
          printf "Environment=%s\nBrowsers=Chromium, Firefox, WebKit\n" \
            "$TEST_ENV" > target/allure-results/environment.properties

      - name: Generate Allure report
        run: |
          if compgen -G "target/allure-results/*.json" > /dev/null; then
            mvn -B allure:report
          else
            echo "No Allure results found"
          fi

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn
