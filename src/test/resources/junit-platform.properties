# Równoległe wykonywanie scenariuszy Cucumber.
# Każdy wątek ma własną przeglądarkę (BrowserManager), a każdy scenariusz własny BrowserContext.
# Liczbę wątków można nadpisać: -Dcucumber.execution.parallel.config.fixed.parallelism=1
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.config.fixed.max-pool-size=3
