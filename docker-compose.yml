services:
  playwright-tests:
    # Wersja z pliku .env (zgodna z playwright.version w pom.xml)
    image: mcr.microsoft.com/playwright/java:v${PLAYWRIGHT_VERSION}-jammy
    working_dir: /app
    init: true
    ipc: host

    volumes:
      - .:/app
      - maven-cache:/root/.m2

    environment:
      TEST_ENV: ${TEST_ENV:-dev}
      BROWSER: ${BROWSER:-chromium}

    command: >
      bash -c "./mvnw -B clean test
      -Denv=$${TEST_ENV}
      -Dbrowser=$${BROWSER}"

volumes:
  maven-cache:
